# Netlify deploy config for the Console app (apps/console). Connect the repo
# in the Netlify dashboard and this file supplies the rest. Vercel and
# Cloudflare Pages auto-detect Astro with no config file at all — point them
# at apps/console (see docs/monorepo.md).

[build]
  command = "npm run build:console"
  publish = "apps/console/dist"

[build.environment]
  NODE_VERSION = "22"
